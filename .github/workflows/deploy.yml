name: Deploy to Lightsail

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare rsync/ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync repo to server
        run: |
          rsync -avzr --delete --exclude '.git' -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}
      - name: Install & restart on server
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.REMOTE_PATH }}
            # install deps (production only)
            npm ci --omit=dev
            npm run build
            # start/reload with pm2
            pm2 describe athlete >/dev/null 2>&1 && pm2 reload athlete || pm2 start "npm start" --name athlete
            pm2 save
          EOF
