name: Deploy to Lightsail

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_actions
          chmod 600 ~/.ssh/id_actions
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      
      - name: Smoke test SSH
        run: |
          ssh -i ~/.ssh/id_actions -o StrictHostKeyChecking=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo CONNECTED && whoami && uname -a"


      - name: Ensure remote path exists and ownership is correct
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
            mkdir -p ${{ secrets.REMOTE_PATH }} && \
            chmod 755 $(dirname ${{ secrets.REMOTE_PATH }}) && \
            chmod 755 ${{ secrets.REMOTE_PATH }}"

      - name: Rsync repo to server
        run: |
          rsync -avzr --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            -e 'ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}/

      - name: Install, build, and restart via PM2
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.REMOTE_PATH }}
            # production install + standalone start
            npm ci --omit=dev
            npm run build
            pm2 describe athlete >/dev/null 2>&1 && \
              pm2 reload athlete || pm2 start "node .next/standalone/server.js" --name athlete
            pm2 save
          EOF
