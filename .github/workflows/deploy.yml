name: Deploy to Lightsail

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Prepare SSH key (from base64) + known_hosts
      - name: Prepare SSH key and known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_actions
          chmod 600 ~/.ssh/id_actions
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          # Optional: if you use a non-standard SSH port, add -p PORT to ssh/rsync later

      # 2) Smoke test SSH so we fail fast with a useful error
      - name: Smoke test SSH
        run: |
          ssh -i ~/.ssh/id_actions -o StrictHostKeyChecking=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo CONNECTED && whoami && uname -a"

      # 3) Ensure remote path exists and is usable
      - name: Ensure remote path
        run: |
          ssh -i ~/.ssh/id_actions -o StrictHostKeyChecking=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
              mkdir -p ${{ secrets.REMOTE_PATH }} && \
              chmod 755 $(dirname ${{ secrets.REMOTE_PATH }}) && \
              chmod 755 ${{ secrets.REMOTE_PATH }}"

      # 4) Sync repo to server (no node_modules, no CI files)
      - name: Rsync repo to server
        run: |
          rsync -avzr --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.env' \
            -e 'ssh -i ~/.ssh/id_actions -o StrictHostKeyChecking=yes' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}/

      # 5) Install, build, and (re)start with PM2 using Next.js standalone
      - name: Build and restart (PM2)
        run: |
          ssh -i ~/.ssh/id_actions -o StrictHostKeyChecking=yes ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.REMOTE_PATH }}
      
            # Install WITH dev deps so Tailwind/PostCSS exist for the build
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install --package-lock-only
              npm install
            fi
      
            npm run build
      
            # Optional: slim down after build (standalone build embeds what it needs)
            npm prune --production || true
      
            if pm2 describe athlete >/dev/null 2>&1; then
              pm2 reload athlete
            else
              pm2 start "node .next/standalone/server.js" --name athlete
            fi
            pm2 save
          EOF

